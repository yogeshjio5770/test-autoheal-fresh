<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoHeal Studio Dashboard</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- AutoHeal SDK: AI-powered self-healing -->
  <script>
    window.AUTOHEAL_SITE_ID = "my-awesome-startup";
    window.AUTOHEAL_ENDPOINT = "https://auomation.vercel.app";
  </script>
  <script src="https://auomation.vercel.app/sdk/autoheal.js?v=1.1.0"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --neon-cyan: #00f0ff;
      --neon-purple: #bd00ff;
      --glass-bg: rgba(15, 23, 42, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover-border: rgba(0, 240, 255, 0.3);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.02);
      --glass-blur: blur(16px);
    }

    .light-mode {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #fae8ff 100%);
      --text-main: #0f172a;
      --text-muted: #475569;
      --neon-cyan: #0ea5e9;
      --neon-purple: #c084fc;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-hover-border: rgba(14, 165, 233, 0.4);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.05), inset 0 0 20px rgba(255, 255, 255, 0.4);
      --glass-blur: blur(16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      perspective: 1000px;
    }

    /* Ambient glow elements */
    .glow-sphere {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(189, 0, 255, 0.05) 50%, transparent 100%);
      filter: blur(40px);
      z-index: -1;
      pointer-events: none;
    }

    .glow-top-right {
      top: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(189, 0, 255, 0.15) 0%, transparent 80%);
    }

    .glow-bottom-left {
      bottom: -150px;
      left: -150px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, transparent 80%);
    }

    /* Outer Wrapper for transitions */
    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      z-index: 1;
    }

    /* Glassmorphic Panel Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      gap: 28px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s;
      animation: card-appear 0.6s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .glass-card:hover {
      border-color: var(--glass-hover-border);
      box-shadow: var(--glass-shadow), 0 0 30px rgba(0, 240, 255, 0.1);
    }

    @keyframes card-appear {
      from { transform: translateY(40px) rotateX(10deg); opacity: 0; }
      to { transform: translateY(0) rotateX(0deg); opacity: 1; }
    }

    /* Logo/Header styling */
    .card-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 100%);
      margin: 0 auto 12px;
      box-shadow: 0 8px 20px rgba(0, 240, 255, 0.25);
    }

    .logo-icon {
      font-size: 24px;
      color: #fff;
    }

    .card-header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-header p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Views Layout (Transitions handled by class toggles) */
    .view-panel {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .view-panel.active {
      display: flex;
      animation: view-fade 0.4s ease;
    }

    @keyframes view-fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Premium Glass Inputs */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
    }

    .glass-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.25);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s;
    }

    .glass-input:focus {
      border-color: var(--neon-cyan);
      background: rgba(15, 23, 42, 0.45);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }

    /* Actions and Buttons */
    .btn-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.4), 0 0 15px rgba(189, 0, 255, 0.3);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    .secondary-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--glass-hover-border);
    }

    .link-action {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      margin-top: 14px;
    }

    .link-action:hover {
      color: var(--neon-cyan);
    }

    /* Top Corner Controls (Theme & Back) */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
      padding: 0 8px;
    }

    .control-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      color: var(--text-main);
      font-size: 18px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .control-circle:hover {
      transform: scale(1.1);
      border-color: var(--neon-cyan);
      box-shadow: var(--glass-shadow), 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .control-circle.disabled {
      opacity: 0;
      pointer-events: none;
    }

    /* Notification Alert Toast */
    .alert-toast {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
      display: none;
      animation: alert-fade 0.3s ease;
    }

    @keyframes alert-fade {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="glow-sphere glow-top-right"></div>
  <div class="glow-sphere glow-bottom-left"></div>

  <div class="app-container">
    
    <!-- Top corner control switches -->
    <div class="top-controls">
      <div id="back-nav-btn" class="control-circle disabled" title="Go Back">
        ←
      </div>
      <div id="theme-toggle-btn" class="control-circle" title="Toggle Theme">
        🌙
      </div>
    </div>

    <!-- Main Evolution Box -->
    <div class="glass-card">
      
      <!-- Brand Logo Header -->
      <div class="card-header">
        <div class="logo-container">
          <span class="logo-icon">🚀</span>
        </div>
        <h1 id="brand-title">Welcome to AutoHeal</h1>
        <p id="brand-desc">Click the ✨ icon in the bottom right to ask AI to evolve your website instantly.</p>
      </div>

      <!-- Alert Message Box -->
      <div id="alert-message" class="alert-toast"></div>

      <!-- VIEW 1: HOME PAGE -->
      <div id="view-home" class="view-panel active">
        <div class="btn-actions">
          <button class="primary-btn" onclick="navigateTo('login')">Sign In to Dashboard</button>
          <button class="secondary-btn" onclick="navigateTo('signup')">Create Free Account</button>
        </div>
      </div>

      <!-- VIEW 2: LOGIN PAGE -->
      <div id="view-login" class="view-panel">
        <div class="input-group">
          <label for="login-email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="login-email" class="glass-input" placeholder="you@domain.com">
          </div>
        </div>
        <div class="input-group">
          <label for="login-pass">Password</label>
          <div class="input-wrapper">
            <input type="password" id="login-pass" class="glass-input" placeholder="••••••••">
          </div>
        </div>
        <div class="btn-actions">
          <button class="primary-btn" onclick="submitLogin()">Verify & Enter</button>
          <div class="link-action" onclick="navigateTo('signup')">Don't have an account? Sign up</div>
        </div>
      </div>

      <!-- VIEW 3: SIGNUP PAGE -->
      <div id="view-signup" class="view-panel">
        <div class="input-group">
          <label for="signup-name">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="signup-name" class="glass-input" placeholder="Jane Doe">
          </div>
        </div>
        <div class="input-group">
          <label for="signup-email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="signup-email" class="glass-input" placeholder="you@domain.com">
          </div>
        </div>
        <div class="input-group">
          <label for="signup-pass">Create Password</label>
          <div class="input-wrapper">
            <input type="password" id="signup-pass" class="glass-input" placeholder="Minimum 8 characters">
          </div>
        </div>
        <div class="btn-actions">
          <button class="primary-btn" onclick="submitSignup()">Create Account</button>
          <div class="link-action" onclick="navigateTo('login')">Already have an account? Sign in</div>
        </div>
      </div>

      <!-- VIEW 4: MEMBER DASHBOARD (POST-LOGIN) -->
      <div id="view-dashboard" class="view-panel">
        <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; text-align: center;">
          <h3 style="font-weight: 600; font-size: 16px;">✨ Member Session Active</h3>
          <p id="dashboard-welcome-msg" style="font-size: 14px; color: var(--text-muted);"></p>
        </div>
        <button class="secondary-btn" onclick="logout()">Sign Out</button>
      </div>

    </div>
  </div>

  <script>
    // Supabase Client Reference
    let supabaseClient = null;

    // Optional Override settings
    window.AUTOHEAL_SUPABASE_URL = "";
    window.AUTOHEAL_SUPABASE_ANON_KEY = "";

    // Navigation routing State
    let currentView = 'home';
    const viewHistory = [];

    // Initialize Supabase dynamically by fetching config from the backend
    async function initSupabase() {
      let url = window.AUTOHEAL_SUPABASE_URL;
      let key = window.AUTOHEAL_SUPABASE_ANON_KEY;

      // 1. Fetch from Render backend config if not hardcoded
      if (!url || !key) {
        try {
          const endpoint = window.AUTOHEAL_ENDPOINT || "https://autoheal-4p4q.onrender.com";
          const res = await fetch(`${endpoint}/api/auth/config`);
          const data = await res.json();
          if (data.success && data.supabaseUrl && data.supabaseAnonKey) {
            url = data.supabaseUrl;
            key = data.supabaseAnonKey;
            console.log("Successfully retrieved Supabase config from backend.");
          }
        } catch (err) {
          console.warn("Failed to fetch Supabase config from backend:", err);
        }
      }

      // 2. Initialize client
      if (url && key) {
        try {
          supabaseClient = window.supabase.createClient(url, key);
          console.log("Supabase client initialized successfully.");
          checkActiveSession();
        } catch (err) {
          console.error("Error creating Supabase client:", err);
        }
      } else {
        console.log("Running in beautiful Demo Mode (Supabase not configured).");
      }
    }

    // Check if there is an active session
    async function checkActiveSession() {
      if (!supabaseClient) return;
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (session && session.user) {
          console.log("Active Supabase session found:", session.user.email);
          const email = session.user.email;
          document.getElementById('dashboard-welcome-msg').textContent = "Logged in via Supabase as " + email + ". Secure session active.";
          navigateTo('dashboard');
        }
      } catch (err) {
        console.error("Active session check error:", err);
      }
    }

    // Trigger initialization on script load
    initSupabase();

    // Navigation triggers
    function navigateTo(viewId) {
      // Manage back button visibility
      const backBtn = document.getElementById('back-nav-btn');
      if (viewId === 'home') {
        backBtn.classList.add('disabled');
        viewHistory.length = 0;
      } else {
        backBtn.classList.remove('disabled');
        if (currentView !== viewId) {
          viewHistory.push(currentView);
        }
      }

      // Toggle views
      document.querySelectorAll('.view-panel').forEach(panel => {
        panel.classList.remove('active');
      });
      document.getElementById('view-' + viewId).classList.add('active');

      // Update titles dynamically
      const title = document.getElementById('brand-title');
      const desc = document.getElementById('brand-desc');

      if (viewId === 'home') {
        title.textContent = "Welcome to AutoHeal";
        desc.textContent = "Click the ✨ icon in the bottom right to ask AI to evolve your website instantly.";
      } else if (viewId === 'login') {
        title.textContent = "Member Login";
        desc.textContent = "Enter your credentials to access your self-healing sandbox environment.";
      } else if (viewId === 'signup') {
        title.textContent = "Register Account";
        desc.textContent = "Join our secure monorepo workspace for unlimited automated debug updates.";
      } else if (viewId === 'dashboard') {
        title.textContent = "Evolution Dashboard";
        desc.textContent = "Welcome to your premium glassmorphic control station.";
        backBtn.classList.add('disabled'); // Keep dashboard isolated
      }

      currentView = viewId;
    }

    // Go back
    document.getElementById('back-nav-btn').addEventListener('click', () => {
      if (viewHistory.length > 0) {
        const prev = viewHistory.pop();
        navigateTo(prev);
      }
    });

    // Theme toggler
    const themeBtn = document.getElementById('theme-toggle-btn');
    let isDark = true;
    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      if (isDark) {
        document.body.classList.remove('light-mode');
        themeBtn.textContent = '🌙';
      } else {
        document.body.classList.add('light-mode');
        themeBtn.textContent = '☀️';
      }
    });

    // Notification Alert Toast
    function triggerAlert(msg) {
      const alert = document.getElementById('alert-message');
      alert.textContent = msg;
      alert.style.display = 'block';
      setTimeout(() => {
        alert.style.display = 'none';
      }, 4000);
    }

    // Real Supabase Sign In / Log In
    async function submitLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value.trim();

      if (!email || !pass) {
        alert('Please fill out all credentials.');
        return;
      }

      const loginBtn = document.querySelector('#view-login .primary-btn');
      const originalText = loginBtn.textContent;
      loginBtn.disabled = true;
      loginBtn.textContent = "Verifying...";

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: pass,
          });

          if (error) {
            triggerAlert("❌ Login failed: " + error.message);
            loginBtn.disabled = false;
            loginBtn.textContent = originalText;
            return;
          }

          triggerAlert("✨ Welcome back!");
          document.getElementById('dashboard-welcome-msg').textContent = "Logged in via Supabase as " + data.user.email + ". Secure session active.";
          setTimeout(() => {
            navigateTo('dashboard');
            loginBtn.disabled = false;
            loginBtn.textContent = originalText;
          }, 600);

        } catch (err) {
          triggerAlert("❌ Authentication error: " + err.message);
          loginBtn.disabled = false;
          loginBtn.textContent = originalText;
        }
      } else {
        // Fallback to simulated login (Demo Mode)
        triggerAlert("✨ Demo Mode: Welcome back, " + email + "!");
        document.getElementById('dashboard-welcome-msg').textContent = "Logged in as " + email + " (Demo Mode). Configure Supabase in Render backend for live auth.";
        setTimeout(() => {
          navigateTo('dashboard');
          loginBtn.disabled = false;
          loginBtn.textContent = originalText;
        }, 600);
      }
    }

    // Real Supabase User Registration
    async function submitSignup() {
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-pass').value.trim();

      if (!name || !email || !pass) {
        alert('Please fill out all registration fields.');
        return;
      }

      const signupBtn = document.querySelector('#view-signup .primary-btn');
      const originalText = signupBtn.textContent;
      signupBtn.disabled = true;
      signupBtn.textContent = "Creating Account...";

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: pass,
            options: {
              data: {
                full_name: name
              }
            }
          });

          if (error) {
            triggerAlert("❌ Sign up failed: " + error.message);
            signupBtn.disabled = false;
            signupBtn.textContent = originalText;
            return;
          }

          if (data.session) {
            triggerAlert("🚀 Account created successfully!");
            document.getElementById('dashboard-welcome-msg').textContent = "Welcome, " + name + "! Logged in via Supabase as " + data.user.email + ". Secure session active.";
            setTimeout(() => {
              navigateTo('dashboard');
              signupBtn.disabled = false;
              signupBtn.textContent = originalText;
            }, 600);
          } else {
            triggerAlert("✉️ Sign up success! Check your email to confirm registration.");
            signupBtn.disabled = false;
            signupBtn.textContent = originalText;
            setTimeout(() => {
              navigateTo('login');
            }, 2500);
          }

        } catch (err) {
          triggerAlert("❌ Sign up error: " + err.message);
          signupBtn.disabled = false;
          signupBtn.textContent = originalText;
        }
      } else {
        // Fallback to simulated signup (Demo Mode)
        triggerAlert("🚀 Demo Mode: Account created successfully!");
        document.getElementById('dashboard-welcome-msg').textContent = "Welcome, " + name + "! Your workspace configuration has been initialized automatically (Demo Mode).";
        setTimeout(() => {
          navigateTo('dashboard');
          signupBtn.disabled = false;
          signupBtn.textContent = originalText;
        }, 600);
      }
    }

    // Real Supabase User Sign Out
    async function logout() {
      const logoutBtn = document.querySelector('#view-dashboard .secondary-btn');
      const originalText = logoutBtn.textContent;
      logoutBtn.disabled = true;
      logoutBtn.textContent = "Signing out...";

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.auth.signOut();
          if (error) {
            console.error("Sign out error:", error);
          }
        } catch (err) {
          console.error("Sign out exception:", err);
        }
      }

      triggerAlert("Signed out successfully.");
      document.getElementById('login-email').value = "";
      document.getElementById('login-pass').value = "";
      document.getElementById('signup-name').value = "";
      document.getElementById('signup-email').value = "";
      document.getElementById('signup-pass').value = "";
      
      setTimeout(() => {
        navigateTo('home');
        logoutBtn.disabled = false;
        logoutBtn.textContent = originalText;
      }, 600);
    }
  </script>
</body>
</html>
